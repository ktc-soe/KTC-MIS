<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KTC · SEM — Student Assessment MIS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--g:#163A2B;--g2:#1f4f3a;--gold:#C29B3B;--gold2:#e7d3a1;--paper:#f4f3ee;--card:#fff;--tint:#edf2ec;--ink:#1a231d;--muted:#5a6b5e;--line:#dde3d8;--ok:#2a7a4b;--err:#b03030;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.lw{min-height:100vh;display:grid;place-items:center;background:var(--g);padding:1rem}
.lc{background:#fff;border-radius:16px;padding:2rem;width:100%;max-width:360px}
.ll{display:flex;align-items:center;gap:.7rem;margin-bottom:1.4rem}
.lb2{width:44px;height:44px;border-radius:11px;background:var(--g);display:grid;place-items:center;font-weight:900;font-size:.85rem;color:var(--gold);letter-spacing:-.5px}
.lt{font-size:1.05rem;font-weight:700;color:var(--g)}.ls{font-size:.72rem;color:var(--muted)}
.lf{margin-bottom:.85rem}.lf label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:.3rem}
.lf input{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:.6rem .75rem;font:inherit;color:var(--ink)}
.lf input:focus{outline:none;border-color:var(--gold)}
.lf .hint{font-size:.63rem;color:var(--muted);margin-top:.2rem}
.lbtn{width:100%;background:var(--g);color:var(--gold);border:none;border-radius:10px;padding:.75rem;font:inherit;font-weight:700;font-size:.95rem;cursor:pointer}
.lbtn:disabled{opacity:.6;cursor:progress}
.lerr{margin-top:.65rem;padding:.55rem .75rem;background:#fbe8e8;color:#8c2828;border-radius:8px;font-size:.8rem;display:none}
.lerr.show{display:block}
.shell{display:none;height:100vh;overflow:hidden}.shell.active{display:flex}
.sb{width:220px;flex:0 0 220px;background:var(--g);display:flex;flex-direction:column;overflow:hidden}
.sbh{padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.sblogo{display:flex;align-items:center;gap:.65rem}
.sbbadge{width:34px;height:34px;border-radius:8px;background:var(--gold);color:var(--g);display:grid;place-items:center;font-weight:900;font-size:.7rem;flex:0 0 auto;letter-spacing:-.5px}
.sbname{color:#fff;font-size:.84rem;font-weight:700;line-height:1.2}.sbsub{color:rgba(255,255,255,.4);font-size:.58rem}
.sbu{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.sbav{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--g);display:grid;place-items:center;font-size:.65rem;font-weight:800;flex:0 0 auto}
.sburow{display:flex;align-items:center;gap:.6rem}
.sbun{color:#fff;font-size:.78rem;font-weight:600}
.sbrl{margin-top:3px}
.srrole{font-size:.6rem;padding:2px 7px;border-radius:99px;font-weight:700;display:inline-block}
.sr-operator{background:var(--gold);color:var(--g)}.sr-admin{background:#378ADD;color:#042C53}
.sr-rater{background:#1D9E75;color:#04342C}
.sbnav{flex:1;padding:5px 0;overflow-y:auto}
.ns{font-size:.6rem;color:rgba(255,255,255,.3);padding:8px 14px 2px;text-transform:uppercase;letter-spacing:.08em}
.ni{display:flex;align-items:center;gap:.65rem;padding:9px 14px;color:rgba(255,255,255,.6);font-size:.79rem;cursor:pointer;border-left:3px solid transparent;transition:background .15s}
.ni:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.ni.active{background:rgba(255,255,255,.13);color:#fff;border-left-color:var(--gold)}
.ni svg{width:15px;height:15px;flex:0 0 auto;opacity:.7}.ni.active svg{opacity:1}
.sbft{padding:10px 14px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:4px}
.sbfb{display:flex;align-items:center;gap:.5rem;color:rgba(255,255,255,.45);font-size:.72rem;cursor:pointer;background:none;border:none;padding:3px 0;width:100%}
.sbfb:hover{color:rgba(255,255,255,.75)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:.7rem 1.2rem;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.ptitle{font-size:1rem;font-weight:700;color:var(--g)}
.tbr{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.content{flex:1;overflow-y:auto;padding:1rem 1.2rem 3rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.95rem 1.05rem;margin-bottom:.8rem}
.pnt{font-size:.87rem;font-weight:700;color:var(--g);margin-bottom:.75rem;display:flex;align-items:center;justify-content:space-between}
.pnt span{font-weight:400;color:var(--muted);font-size:.7rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.65rem;margin-bottom:.8rem}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.8rem .95rem}
.kpin{font-size:1.55rem;font-weight:800;color:var(--g);line-height:1}.kpil{font-size:.66rem;color:var(--muted);margin-top:.2rem}
.kpi.gold{background:var(--g)}.kpi.gold .kpin{color:var(--gold2)}.kpi.gold .kpil{color:rgba(255,255,255,.6)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.77rem}
th{background:var(--g);color:#fff;font-weight:600;padding:.42rem .55rem;text-align:left;white-space:nowrap;cursor:pointer}
th:hover{background:var(--g2)}
td{border:1px solid var(--line);padding:.4rem .55rem;white-space:nowrap}
tbody tr:nth-child(even){background:var(--tint)}
tbody tr:hover{background:#e8f0e6}
td.r{text-align:right}
.tlink{color:var(--g);cursor:pointer;text-decoration:underline}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.field{display:flex;flex-direction:column;gap:.22rem}
.field label{font-size:.7rem;font-weight:600;color:var(--muted)}
.field .hint{font-size:.62rem;color:var(--muted);font-style:italic}
.field input,.field select,.field textarea{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:.5rem .62rem;font:inherit;color:var(--ink);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,155,59,.1)}
.field textarea{min-height:55px;resize:vertical}
.field.full{grid-column:1/-1}
.fa{margin-top:.8rem;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;font:inherit;font-weight:700;cursor:pointer;border:none;border-radius:9px;padding:.6rem 1rem;font-size:.82rem}
.bp{background:var(--gold);color:var(--g)}.bp:hover{filter:brightness(1.04)}.bp:disabled{opacity:.55;cursor:progress}
.bg{background:#fff;border:1.5px solid var(--line);color:var(--g)}
.bd{background:#fbe8e8;border:1.5px solid #eec3c3;color:var(--err)}
.bsm{padding:.35rem .65rem;font-size:.72rem;border-radius:7px}
.pill{font-size:.63rem;padding:2px 7px;border-radius:99px;font-weight:600}
.pg{background:#e1f5ee;color:#085041}.pb{background:#e6f1fb;color:#0C447C}
.po{background:#faeeda;color:#633806}.pr{background:#fbe8e8;color:#8c2828}
.pp{background:#EEEDFE;color:#3C3489}
.msg{padding:.55rem .75rem;border-radius:8px;font-size:.8rem;display:none;margin-top:.45rem}
.msg.show{display:block}.mok{background:#e5f3eb;color:#1b5e38;border:1px solid #b8dfc8}
.merr{background:#fbe8e8;color:#8c2828;border:1px solid #edc0c0}
.mwarn{background:#faeeda;color:#633806;border:1px solid #e7d3a1}
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;overflow-y:auto}
.mbg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:1.35rem;width:100%;max-width:620px;position:relative}
.modal.wide{max-width:860px}
.mt2{font-size:.98rem;font-weight:700;color:var(--g);margin-bottom:1rem;padding-bottom:.55rem;border-bottom:1px solid var(--line);padding-right:1.5rem}
.mc{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--muted)}
.tabs{display:flex;gap:0;margin-bottom:1rem;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.tab{padding:.55rem .9rem;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px}
.tab.active{color:var(--g);border-bottom-color:var(--gold)}
.tpanel{display:none}.tpanel.active{display:block}
/* Score grid */
.score-grid{display:grid;grid-template-columns:1fr;gap:.55rem}
.score-row{background:var(--tint);border-radius:9px;padding:.65rem .8rem;display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:start}
.score-label{font-size:.78rem;font-weight:700;color:var(--g)}
.score-sublabel{font-size:.63rem;color:var(--muted);margin-top:1px}
.score-inputs{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.score-sel{background:#fff;border:1.5px solid var(--line);border-radius:7px;padding:.38rem .5rem;font:inherit;font-size:.78rem;color:var(--ink);min-width:120px}
.score-sel:focus{outline:none;border-color:var(--gold)}
.score-comment{background:#fff;border:1.5px solid var(--line);border-radius:7px;padding:.38rem .6rem;font:inherit;font-size:.73rem;width:100%;margin-top:.35rem;resize:none;min-height:38px}
.score-comment:focus{outline:none;border-color:var(--gold)}
/* Score badge colors */
.sc0{background:#f1efea;color:#5f6b62}.sc1{background:#fbe8e8;color:#8c2828}
.sc2{background:#fde8d8;color:#7a3010}.sc3{background:#faeeda;color:#633806}
.sc4{background:#e6f1fb;color:#0C447C}.sc5{background:#e1f5ee;color:#085041}
/* Student cards */
.stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.65rem}
.stcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.85rem 1rem;cursor:pointer;transition:border-color .15s}
.stcard:hover{border-color:var(--gold)}
.stav{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--g);display:grid;place-items:center;font-size:.7rem;font-weight:700;flex:0 0 auto}
/* Progress bar */
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:.3rem}
.progf{height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
/* Status badges */
.status-open{background:#e1f5ee;color:#085041}.status-closed{background:#fbe8e8;color:#8c2828}
.status-active{background:#e1f5ee;color:#085041}.status-late{background:#faeeda;color:#633806}
.sbar{display:flex;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap;align-items:center}
.sbar input,.sbar select{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:.48rem .65rem;font:inherit;font-size:.8rem;color:var(--ink)}
.sbar input{flex:1;min-width:160px}
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--gold);border-radius:0 0 8px 8px;z-index:50;max-height:180px;overflow-y:auto;display:none}
.ac-list.open{display:block}
.ac-item{padding:.4rem .65rem;font-size:.78rem;cursor:pointer;border-bottom:.5px solid var(--line)}
.ac-item:hover{background:var(--tint)}
.empty{text-align:center;color:var(--muted);padding:2.5rem 1rem;font-size:.84rem}
.loading{text-align:center;color:var(--muted);padding:2rem;font-size:.84rem;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rater-status{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.rs{font-size:.68rem;padding:3px 9px;border-radius:99px;font-weight:600}
.rs-done{background:#e1f5ee;color:#085041}.rs-edited{background:#e6f1fb;color:#0C447C}
.rs-pending{background:#faeeda;color:#633806}
@media(max-width:640px){
.sb{width:52px;flex:0 0 52px}.sbname,.sbsub,.sbun,.sbrl,.ni span,.ns,.sbft .sbfb span{display:none}
.sbbadge{margin:auto}.fg{grid-template-columns:1fr}.field.full{grid-column:1}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="lw" id="loginWrap">
  <div class="lc">
    <div class="ll">
      <div class="lb2">KTC</div>
      <div><div class="lt">KTC · SEM</div><div class="ls">Student Assessment Management System<br>Kibidula Training Centre of Evangelism</div></div>
    </div>
    <div class="lf"><label>Username</label><input type="text" id="lUser" placeholder="Your username" autocomplete="username"><div class="hint">Not case-sensitive</div></div>

<!-- SHELL -->
<div class="shell" id="appShell">
  <div class="sb">
    <div class="sbh"><div class="sblogo"><div class="sbbadge">KTC</div><div><div class="sbname">KTC · SEM</div><div class="sbsub">Student Assessment MIS</div></div></div></div>
    <div class="sbu"><div class="sburow"><div class="sbav" id="sbAv">--</div><div><div class="sbun" id="sbName">--</div><div class="sbrl" id="sbRole"></div></div></div></div>
    <div class="sbnav" id="sbNav">

      <div class="ns">Assessment</div>

      <div class="ni" data-page="reports" data-acc="reports">

    </div>
    <div class="sbft">
      <button class="sbfb" id="cpBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Change password</span></button>

<!-- MODAL -->
<div class="mbg" id="mBg"><div class="modal" id="mBox"><button class="mc" id="mClose">✕</button><div class="mt2" id="mTitle"></div><div id="mBody"></div></div></div>

<script>
const URL_="https://script.google.com/macros/s/AKfycbxag2X9jkGtf1OYuuvirgb2ddDjT5aeOf7ndhY6XzoTW1tjiS7Fhx_YHnjdbpQlrhTK/exec";

const CATS=[
  {id:"nidhamu",en:"Discipline",sw:"Nidhamu"},
  {id:"kujisimamia",en:"Self-management",sw:"Kujisimamia Binafsi"},
  {id:"kutunza_muda",en:"Time-keeping",sw:"Kutunza Muda"},
  {id:"uwezo_kazi",en:"Work ability",sw:"Uwezo wa Kufanya Kazi"},
  {id:"usafi",en:"Hygiene",sw:"Usafi wa Nje na Ndani"},
  {id:"uwezo_masomo",en:"Receptiveness",sw:"Uwezo wa Kupokea Masomo"}
];

const SCALE={0:"0 — Hafifu/Mbaya Sana",1:"1 — Hafifu/Mbaya",2:"2 — Si Nzuri/Vizuri",3:"3 — Wastani",4:"4 — Nzuri/Vizuri",5:"5 — Nzuri/Vizuri Sana"};

const SEM2_STUDENTS=["ADONIA SADIKI","ALLY SAID SHABANI","ALOYCE KIMIMBI","ALSEN MATHIAS","AMOS RAPHAEL MAPUNDA","BARAKA SAFARI ANTONI","EDIGA KALAVER FUNGAMEZA","EDYSON C ZUMBA","EMMANUEL JAPHETH","EMMANUEL KABUCHANDA","ERICK HYELA","EZRA MARKO","FAUSTINE JOACHIM","FRANK R ANTHONY","GABRIELI A MWANISENGA","GEORGE MWOGOFI","HABAKUKI YONAH SHADRACK","HOSEA BONIFACE MTONYOLE","IMANI JACKSON SAIBU","IVAN MWITWA MALIYATABU","JACKSON MWAMBENE","JACOB LUKAS BAHAME","JAPHETH MARKO SHIJA","JOEL MSHINGILWA","JOHNSON JOHN MOSES KIVUNGE","MAGNUS DONATUS RWEIKAZA","MICHAEL MGOMERA","MUSA J MAKOLOLOMA","MUSA MTELEMKO","NEHEMIA LUKASI","NORBERT ALBAN MARTIN","PASCAL CASMELI MKOBA","RABAN MICHAEL","RIZIKI AMBROCE NJOVU","SIJAONA P KASEBELE","WILLIAM FRANCIS KALOLI"];

const TZ_REGIONS=["Arusha","Dar es Salaam","Dodoma","Geita","Iringa","Kagera","Katavi","Kigoma","Kilimanjaro","Lindi","Manyara","Mara","Mbeya","Morogoro","Mtwara","Mwanza","Njombe","Pwani","Rukwa","Ruvuma","Shinyanga","Simiyu","Singida","Songwe","Tabora","Tanga","Pemba North","Pemba South","Unguja North","Unguja South","Zanzibar Urban"];

const NATIONALITIES=["Tanzania","Kenya","Uganda","Rwanda","Burundi","Congo (DRC)","Malawi","Zambia","Zimbabwe","Mozambique","South Africa","Ethiopia","Sudan","Ghana","Nigeria","Other"];

let USER=null;
const CACHE={},CACHE_TS={};
const TTL=120000;
function isFresh(k){return CACHE[k]&&(Date.now()-CACHE_TS[k])<TTL;}
function setCache(k,v){CACHE[k]=v;CACHE_TS[k]=Date.now();}
function clearCache(){Object.keys(CACHE).forEach(k=>{delete CACHE[k];delete CACHE_TS[k];});}

async function GET(params){
  const q=new URLSearchParams({...params,username:USER.username,password:USER.password});
  try{
    const res=await fetch(URL_+"?"+q);
    const text=await res.text();
    if(text.trim().startsWith("<")) return {ok:false,error:"Server error — try again"};
    return JSON.parse(text);
  }catch(e){return {ok:false,error:e.message};}
}
async function POST(body){
  try{
    const res=await fetch(URL_,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,username:USER.username,password:USER.password})});
    const text=await res.text();
    if(text.trim().startsWith("<")) return {ok:false,error:"Server error — try again"};
    return JSON.parse(text);
  }catch(e){return {ok:false,error:e.message};}
}
async function getSheet(name){
  if(isFresh(name)) return CACHE[name];
  const res=await GET({action:"read_"+name});
  if(res.ok) setCache(name,res.rows);
  return res.ok?res.rows:[];
}
async function getBatch(sheets){
  const key="b_"+sheets.join(",");
  if(isFresh(key)) return CACHE[key];
  const res=await GET({action:"read_batch",sheets:sheets.join(",")});
  if(res.ok) setCache(key,res);
  return res;
}

function saveSession(u){try{sessionStorage.setItem("ktc_user",JSON.stringify(u));}catch(e){}}
function loadSession(){try{const s=sessionStorage.getItem("ktc_user");return s?JSON.parse(s):null;}catch(e){return null;}}
function clearSession(){try{sessionStorage.removeItem("ktc_user");}catch(e){}}

document.getElementById("lBtn").addEventListener("click",doLogin);

async function doLogin(){
  const btn=document.getElementById("lBtn"),err=document.getElementById("lErr");
  const u=document.getElementById("lUser").value.trim(),p=document.getElementById("lPass").value;
  if(!u||!p){showE(err,"Enter username and password.");return;}
  btn.disabled=true;btn.textContent="Signing in…";err.classList.remove("show");
  try{
    const q=new URLSearchParams({action:"login",username:u,password:p});
    const text=await (await fetch(URL_+"?"+q)).text();
    if(text.trim().startsWith("<")){showE(err,"Server error. Try again.");btn.disabled=false;btn.textContent="Sign in";return;}
    const data=JSON.parse(text);
    if(data.ok){USER=data;USER.username=u;USER.password=p;saveSession(USER);bootApp();}
    else showE(err,data.error||"Sign-in failed.");
  }catch(e){showE(err,"Cannot connect. Check internet.");}
  finally{btn.disabled=false;btn.textContent="Sign in";}
}
function showE(el,m){el.textContent=m;el.classList.add("show");}

function bootApp(){
  document.getElementById("loginWrap").style.display="none";
  document.getElementById("appShell").classList.add("active");
  document.getElementById("sbAv").textContent=initials(USER.name);
  document.getElementById("sbName").textContent=USER.name;
  document.getElementById("sbRole").innerHTML=`<span class="srrole sr-${USER.role}">${cap(USER.role)}</span>`;
  const acc=USER.access||[];
  document.querySelectorAll(".ni[data-acc]").forEach(ni=>{ni.style.display=acc.includes(ni.dataset.acc)?"flex":"none";});
  document.querySelectorAll(".ni").forEach(ni=>ni.addEventListener("click",()=>navigate(ni.dataset.page)));
  document.getElementById("soBtn").addEventListener("click",()=>{if(confirm("Sign out?")){clearSession();location.reload();}});

  navigate("dashboard");
}

function selectSession(sessionId){
  window._activeSession=sessionId;
  const students=window._semStudents||[];
  const scores=window._scores||[];
  const myScores=scores.filter(s=>s.session_id===sessionId&&(s.rater_id===USER.id||s.rater_name===USER.name));
  const myScoreMap={};myScores.forEach(s=>{myScoreMap[s.student_id]=s;});
  // Update button styles
  document.querySelectorAll("[id^='sbtn_']").forEach(b=>{b.className="btn bg";});
  const btn=document.getElementById("sbtn_"+sessionId.replace(/[^a-z0-9]/gi,"_"));
  if(btn) btn.className="btn bp";
  const el=document.getElementById("assessContent");
  if(!el) return;
  const session=window._openSessions?.find(s=>s.session_id===sessionId);
  el.innerHTML=`
    <div class="panel">
      <div class="pnt">${session?.label||sessionId} <span>${myScores.length}/${students.length} scored</span></div>
      <div class="sbar"><input type="text" id="assessQ" placeholder="Search student…" oninput="filterAssessStudents()"></div>
      <div class="stg" id="assessGrid">${renderAssessCards(students,myScoreMap,sessionId)}</div>
    </div>
  `;
  window._assessMap=myScoreMap;window._assessSession=sessionId;
}

function renderAssessCards(students,scoreMap,sessionId){
  if(!students.length) return `<div class="empty" style="grid-column:1/-1">No students in this semester.</div>`;
  return students.map(st=>{
    const sc=scoreMap[st._id];
    const status=sc?(sc.edited==="YES"?"Edited — final":"Submitted"):"Pending";
    const statusClass=sc?(sc.edited==="YES"?"pb":"pg"):"po";
    const avg=sc?Number(sc.overall_avg||0).toFixed(2):"—";
    return `<div class="stcard" onclick="openScoreForm('${st._id}','${esc(st.full_name)}','${sessionId}')">
      <div style="display:flex;align-items:center;gap:.65rem">
        <div class="stav">${initials(st.full_name)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:.82rem;font-weight:700;color:var(--ink)">${st.full_name}</div>
          <div style="font-size:.65rem;color:var(--muted);font-family:monospace">${st.reg_no}</div>
          <div style="display:flex;gap:.3rem;margin-top:.3rem;align-items:center">
            <span class="pill ${statusClass}">${status}</span>
            ${sc?`<span style="font-size:.65rem;color:var(--muted)">Avg: <b style="color:var(--g)">${avg}</b></span>`:""}
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
}

function filterAssessStudents(){
  const q=(document.getElementById("assessQ")?.value||"").toLowerCase();
  const f=(window._semStudents||[]).filter(s=>(s.full_name||"").toLowerCase().includes(q)||(s.reg_no||"").includes(q));
  const el=document.getElementById("assessGrid");
  if(el) el.innerHTML=renderAssessCards(f,window._assessMap||{},window._assessSession||"");
}

function openScoreForm(studentId,studentName,sessionId){
  const existing=(window._scores||[]).find(s=>s.session_id===sessionId&&s.student_id===studentId&&(s.rater_id===USER.id||s.rater_name===USER.name));
  const isLocked=existing?.locked==="YES";
  const isEdited=existing?.edited==="YES";
  const canEdit=existing&&!isLocked&&!isEdited;
  const isNew=!existing;
  if(isLocked){openMod(studentName,"<div class='empty'>Scores are locked — session has been closed.</div>");return;}
  openMod(`Score: ${studentName}`,`
    <div style="font-size:.72rem;color:var(--muted);margin-bottom:.65rem">
      Session: <b>${sessionId}</b> · Rater: <b>${USER.name}</b>
      ${existing?`<span class="pill ${isEdited?"pb":"pg"}" style="margin-left:.4rem">${isEdited?"Edited — final":"Submitted"}</span>`:""}
      ${existing&&!isEdited?`<div style="margin-top:.35rem;font-size:.68rem;color:var(--err)">⚠ You have <b>one edit</b> remaining. After editing, scores will be permanently locked.</div>`:""}
      ${isEdited?`<div style="margin-top:.35rem;font-size:.68rem;color:var(--err)">🔒 You have used your edit. These scores are final and cannot be changed.</div>`:""}
    </div>
    <div class="score-grid">
      ${CATS.map(cat=>{
        const val=existing?Number(existing[cat.id]||0):0;
        const comment=existing?existing[cat.id+"_comment"]||"":"";
        return `<div class="score-row">
          <div>
            <div class="score-label">${cat.sw}</div>
            <div class="score-sublabel">${cat.en}</div>
          </div>
          <div style="width:100%">
            <select id="sc_${cat.id}" class="score-sel sc${val}" onchange="colorScore(this)" ${isEdited?"disabled":""}>
              ${Object.entries(SCALE).map(([k,v])=>`<option value="${k}" ${Number(k)===val?"selected":""}>${v}</option>`).join("")}
            </select>
            <textarea id="sc_${cat.id}_comment" class="score-comment" placeholder="Comment (optional)…" ${isEdited?"disabled":""}>${comment}</textarea>
          </div>
        </div>`;
      }).join("")}
    </div>
    ${!isEdited?`
    <div class="fa">
      <button class="btn bp" onclick="submitScores('${studentId}','${esc(studentName)}','${sessionId}',${canEdit})">${isNew?"Submit scores":canEdit?"Save edit":""}</button>
      <button class="btn bg" onclick="closeMod()">Cancel</button>
    </div>
    <div class="msg" id="scoreMsg"></div>`:""}
  `);
}

function colorScore(sel){
  const n=Number(sel.value);
  sel.className="score-sel sc"+n;
}

async function submitScores(studentId,studentName,sessionId,isEdit){
  const msg=document.getElementById("scoreMsg");
  const payload={session_id:sessionId,student_id:studentId,student_name:studentName,rater_id:USER.id,rater_name:USER.name};
  CATS.forEach(cat=>{
    payload[cat.id]=Number(document.getElementById("sc_"+cat.id)?.value||0);
    payload[cat.id+"_comment"]=document.getElementById("sc_"+cat.id+"_comment")?.value.trim()||"";
  });
  const res=await POST({action:"submit_scores",payload});
  if(res.ok){
    clearCache();
    showMsg(msg,"ok",isEdit?`Edit saved. Average: ${res.avg||"—"}/5. Scores now locked — no further edits.`:`Scores submitted. Average: ${res.avg||"—"}/5.`);
    // Refresh scores cache
    setTimeout(async()=>{
      const d=await getBatch(["scores"]);
      window._scores=d.scores||[];
      const myScores=(window._scores||[]).filter(s=>s.session_id===sessionId&&(s.rater_id===USER.id||s.rater_name===USER.name));
      const myScoreMap={};myScores.forEach(s=>{myScoreMap[s.student_id]=s;});
      window._assessMap=myScoreMap;
      const el=document.getElementById("assessGrid");
      if(el) el.innerHTML=renderAssessCards(window._semStudents||[],myScoreMap,sessionId);
      closeMod();
    },1200);
  } else showMsg(msg,"err",res.error||"Failed.");
}

function filterStudents(){
  const q=(document.getElementById("stuQ")?.value||"").toLowerCase();
  const sem=document.getElementById("stuSem")?.value||"";
  const status=document.getElementById("stuStatus")?.value||"";
  const f=(window._filterStudents||[]).filter(s=>{
    const m=(s.full_name||"").toLowerCase().includes(q)||(s.reg_no||"").includes(q);
    const sm=!sem||s.semester_id===sem;
    const st=!status||(status==="late"?s.reporting_status==="Late":s.status===status);
    return m&&sm&&st;
  });
  document.getElementById("stuGrid").innerHTML=renderStudentCards(f);
}

async function viewSessionProgress(sessionId){
  openMod("Session progress — "+sessionId,"<div class='loading'><div class='spinner'></div>Loading…</div>");
  const res=await GET({action:"get_scores_by_session",session_id:sessionId});
  const sems=window._sems||await getSheet("semesters");
  const students=window._students||await getSheet("students");
  const session=(window._sessions||[]).find(s=>s.session_id===sessionId)||{};
  const semStudents=students.filter(s=>s.semester_id===session.semester_id);
  if(!res.ok){document.getElementById("mBody").innerHTML=`<div class="empty">${res.error}</div>`;return;}
  const scores=res.scores||[];
  const raterMap={};
  scores.forEach(s=>{
    if(!raterMap[s.rater_name]) raterMap[s.rater_name]={name:s.rater_name,scores:[],edited:0};
    raterMap[s.rater_name].scores.push(s);
    if(s.edited==="YES") raterMap[s.rater_name].edited++;
  });
  const studentsScored=[...new Set(scores.map(s=>s.student_id))].length;
  document.getElementById("mBox").classList.add("wide");
  document.getElementById("mBody").innerHTML=`
    <div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:.75rem">
      <div class="kpi gold"><div class="kpin">${semStudents.length}</div><div class="kpil">Total students</div></div>
      <div class="kpi"><div class="kpin" style="color:var(--g)">${studentsScored}</div><div class="kpil">Students scored</div></div>
      <div class="kpi"><div class="kpin" style="color:var(--g)">${Object.keys(raterMap).length}</div><div class="kpil">Raters submitted</div></div>
    </div>
    <div class="pnt" style="margin-bottom:.5rem">Rater submission status</div>
    <div class="rater-status" style="margin-bottom:.85rem">
      ${Object.values(raterMap).map(r=>`<span class="rs ${r.edited>0?"rs-edited":"rs-done"}">${r.name} — ${r.scores.length} students${r.edited>0?" (edited)":""}</span>`).join("")}
    </div>
    <div class="pnt" style="margin-bottom:.5rem">Student averages across all raters</div>
    <div class="tw"><table>
      <thead><tr><th>Student</th><th>Reg No</th>${CATS.map(c=>`<th>${c.sw.split(" ")[0]}</th>`).join("")}<th>Overall avg</th></tr></thead>
      <tbody>${semStudents.map(st=>{
        const stScores=scores.filter(s=>s.student_id===st._id);
        if(!stScores.length) return `<tr><td>${st.full_name}</td><td style="font-family:monospace">${st.reg_no}</td>${CATS.map(()=>`<td style="text-align:center;color:var(--muted)">—</td>`).join("")}<td style="text-align:center;color:var(--muted)">—</td></tr>`;
        const catAvgs=CATS.map(cat=>{
          const vals=stScores.map(s=>Number(s[cat.id]||0)).filter(n=>!isNaN(n));
          return vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2):"—";
        });
        const overall=(catAvgs.filter(a=>a!=="—").reduce((a,b)=>a+Number(b),0)/catAvgs.filter(a=>a!=="—").length).toFixed(2);
        return `<tr><td>${st.full_name}</td><td style="font-family:monospace">${st.reg_no}</td>${catAvgs.map(a=>`<td class="r" style="font-size:.72rem">${a}</td>`).join("")}<td class="r"><b style="color:var(--g)">${overall}</b></td></tr>`;
      }).join("")}
      </tbody>
    </table></div>
  `;
}

/* ── STAFF ── */
async function renderStaff(){
  loading();
  try{
    const rows=await GET({action:"read_staff"});
    const staff=rows.rows||[];window._staff=staff;
    const active=staff.filter(r=>r.status==="active").length;
    document.getElementById("tbr").innerHTML=`<span class="pill pg">${active} active</span>`;
    set(`
      <button class="btn bp" style="margin-bottom:.8rem" onclick="openAddStaff()">+ Add staff account</button>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.65rem">
        ${staff.map(s=>`
          <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.85rem">
            <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem">
              <div style="width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--g);display:grid;place-items:center;font-size:.7rem;font-weight:800;flex:0 0 auto">${initials(s.name)}</div>
              <div><div style="font-size:.8rem;font-weight:700">${s.name||"—"}</div><div style="font-size:.63rem;color:var(--muted)">@${s.username||"—"}</div></div>
            </div>
            <div style="margin-bottom:.45rem"><span class="srrole sr-${s.role||"rater"}">${cap(s.role||"rater")}</span></div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:.62rem;padding:2px 6px;border-radius:99px;font-weight:600;${s.status==="active"?"background:#e1f5ee;color:#085041":"background:#fbe8e8;color:#8c2828"}">${cap(s.status||"active")}</span>
              <div style="display:flex;gap:.25rem">
                <button style="font-size:.63rem;padding:2px 7px;border-radius:5px;border:1px solid var(--line);background:var(--card);color:var(--g);cursor:pointer" onclick="openEditStaff('${s._id}')">Edit</button>
                ${s.status==="active"?`<button style="font-size:.63rem;padding:2px 7px;border-radius:5px;border:1px solid #eec3c3;background:#fbe8e8;color:var(--err);cursor:pointer" onclick="toggleStaff('${s._id}','${esc(s.name)}','revoked')">Revoke</button>`:`<button style="font-size:.63rem;padding:2px 7px;border-radius:5px;border:1px solid var(--line);background:var(--card);color:var(--g);cursor:pointer" onclick="toggleStaff('${s._id}','${esc(s.name)}','active')">Restore</button>`}
              </div>
            </div>
          </div>`).join("")||`<div class="empty" style="grid-column:1/-1">No staff accounts yet.</div>`}
      </div>
    `);
  }catch(e){set(`<div class="empty">${e.message}</div>`);}
}

function openAddStaff(){
  openMod("Add staff account",`
    <div class="fg">
      <div class="field full"><label>Full name *</label><input type="text" id="sfN" placeholder="Full name"></div>
      <div class="field"><label>Username *</label><input type="text" id="sfU" placeholder="e.g. mfilinge"><div class="hint">Not case-sensitive at login</div></div>
      <div class="field"><label>Password *</label><input type="text" id="sfP" placeholder="Set a password"><div class="hint">Case-sensitive</div></div>
      <div class="field"><label>Role *</label><select id="sfR"><option value="rater">Rater (Teacher)</option><option value="admin">Admin</option></select></div>
    </div>
    <div class="fa"><button class="btn bp" onclick="submitStaff()">Create account</button><button class="btn bg" onclick="closeMod()">Cancel</button></div>
    <div class="msg" id="sfMsg"></div>
  `);
}

async function submitStaff(){
  const msg=document.getElementById("sfMsg");
  if(!v("sfN")||!v("sfU")||!v("sfP")){showMsg(msg,"err","Name, username and password required.");return;}
  const res=await POST({action:"add_staff",payload:{name:v("sfN"),username:v("sfU"),password:v("sfP"),role:v("sfR")}});
  if(res.ok){showMsg(msg,"ok","Account created.");setTimeout(()=>{closeMod();renderStaff();},1200);}
  else showMsg(msg,"err",res.error||"Failed.");
}

function openEditStaff(id){
  const s=(window._staff||[]).find(r=>r._id===id);if(!s) return;
  openMod("Edit — "+s.name,`
    <div class="fg">
      <div class="field full"><label>Full name</label><input type="text" id="esfN" value="${esc(s.name||"")}"></div>
      <div class="field"><label>Username</label><input type="text" id="esfU" value="${esc(s.username||"")}"></div>
      <div class="field"><label>New password (blank = keep)</label><input type="text" id="esfP" placeholder="Leave blank to keep"></div>
      <div class="field"><label>Role</label><select id="esfR"><option value="rater" ${s.role==="rater"?"selected":""}>Rater</option><option value="admin" ${s.role==="admin"?"selected":""}>Admin</option></select></div>
    </div>
    <div class="fa"><button class="btn bp" onclick="submitEditStaff('${id}')">Save</button><button class="btn bg" onclick="closeMod()">Cancel</button></div>
    <div class="msg" id="esfMsg"></div>
  `);
}

async function submitEditStaff(id){
  const msg=document.getElementById("esfMsg");
  const payload={_id:id,name:v("esfN"),username:v("esfU"),role:v("esfR")};
  if(v("esfP")) payload.password=v("esfP");
  const res=await POST({action:"update_staff",payload});
  if(res.ok){showMsg(msg,"ok","Updated.");setTimeout(()=>{closeMod();renderStaff();},1200);}
  else showMsg(msg,"err",res.error||"Failed.");
}

async function toggleStaff(id,name,status){
  if(!confirm(`${status==="revoked"?"Revoke":"Restore"} account for ${name}?`)) return;
  const res=await POST({action:"update_staff",payload:{_id:id,status}});
  if(res.ok) renderStaff();else alert(res.error||"Failed.");
}

/* ── REPORTS ── */
async function renderReports(){
  loading();
  if(!["operator","admin"].includes(USER.role)){set(`<div class="empty">Reports are restricted to Admin and Operator.</div>`);return;}
  try{
    const d=await getBatch(["students","sessions","scores","semesters"]);
    const students=d.students||[],sessions=d.sessions||[],scores=d.scores||[],sems=d.semesters||[];
    const activeSem=sems.find(s=>s.status==="active")||sems[sems.length-1]||{};
    const semStudents=students.filter(s=>s.semester_id===activeSem.semester_code);
    const semSessions=sessions.filter(s=>s.semester_id===activeSem.semester_code);
    set(`
      <div class="panel" style="margin-bottom:.8rem">
        <div class="pnt">Export data — ${activeSem.label||activeSem.semester_code||"Active semester"}</div>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          <button class="btn bg" onclick="exportStudentsCSV()">⬇ Students CSV</button>
          <button class="btn bg" onclick="exportScoresCSV()">⬇ All scores CSV</button>
          <button class="btn bg" onclick="exportClassSummary()">⬇ Class summary CSV</button>
        </div>
      </div>
      <div class="panel">
        <div class="pnt">Class score summary <span>${activeSem.label||"—"}</span></div>
        <div class="sbar">
          <select id="repSession" onchange="renderRepTable()">
            <option value="">All sessions combined</option>
            ${semSessions.map(s=>`<option value="${s.session_id}">${s.label||s.session_id}</option>`).join("")}
          </select>
        </div>
        <div id="repTable"></div>
      </div>
    `);
    window._repStudents=semStudents;window._repScores=scores;window._repSessions=semSessions;
    renderRepTable();
  }catch(e){set(`<div class="empty">${e.message}</div>`);}
}

function renderRepTable(){
  const sessionFilter=document.getElementById("repSession")?.value||"";
  const students=window._repStudents||[];
  const allScores=window._repScores||[];
  const scores=sessionFilter?allScores.filter(s=>s.session_id===sessionFilter):allScores;
  const el=document.getElementById("repTable");
  if(!el) return;
  el.innerHTML=`<div class="tw"><table>
    <thead><tr><th>#</th><th>Student</th><th>Reg No</th>${CATS.map(c=>`<th style="font-size:.65rem">${c.sw.split(" ")[0]}</th>`).join("")}<th>Overall</th></tr></thead>
    <tbody>${students.map((st,i)=>{
      const stScores=scores.filter(s=>s.student_id===st._id);
      if(!stScores.length) return `<tr><td>${i+1}</td><td>${st.full_name}</td><td style="font-family:monospace">${st.reg_no}</td>${CATS.map(()=>`<td style="text-align:center;color:var(--muted)">—</td>`).join("")}<td style="text-align:center;color:var(--muted)">—</td></tr>`;
      const catAvgs=CATS.map(cat=>{const vals=stScores.map(s=>Number(s[cat.id]||0));return vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2):"—";});
      const overall=(catAvgs.filter(a=>a!=="—").reduce((a,b)=>a+Number(b),0)/catAvgs.filter(a=>a!=="—").length||0).toFixed(2);
      const ov=Number(overall);
      return `<tr><td>${i+1}</td><td>${st.full_name}</td><td style="font-family:monospace">${st.reg_no}</td>${catAvgs.map(a=>`<td class="r" style="font-size:.72rem;color:${Number(a)>=4?"var(--ok)":Number(a)<3?"var(--err)":"inherit"}">${a}</td>`).join("")}<td class="r"><b style="color:${ov>=4?"var(--ok)":ov<3?"var(--err)":"var(--g)"}">${overall}</b></td></tr>`;
    }).join("")}
    </tbody>
  </table></div>`;
}

function exportStudentsCSV(){
  const rows=window._repStudents||[];
  if(!rows.length){alert("No students to export.");return;}
  const keys=["reg_no","full_name","gender","nationality","tribe","religion","marital_status","region","district","phone","church","pastor","reporting_date","reporting_status","status","semester_id"];
  const esc2=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv=keys.join(",")+"\n"+rows.map(r=>keys.map(k=>esc2(r[k])).join(",")).join("\n");
  dlCSV(csv,"KTC_Students_"+today());
}

function exportScoresCSV(){
  const scores=window._repScores||[];
  if(!scores.length){alert("No scores to export.");return;}
  const keys=["session_id","student_name","reg_no","rater_name",...CATS.map(c=>c.id),...CATS.map(c=>c.id+"_comment"),"overall_avg","submitted","edited","locked"];
  const esc2=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv=keys.join(",")+"\n"+scores.map(r=>keys.map(k=>esc2(r[k])).join(",")).join("\n");
  dlCSV(csv,"KTC_Scores_"+today());
}

function exportClassSummary(){
  const students=window._repStudents||[];
  const scores=window._repScores||[];
  const rows=students.map(st=>{
    const stScores=scores.filter(s=>s.student_id===st._id);
    const row={reg_no:st.reg_no,full_name:st.full_name,semester_id:st.semester_id};
    CATS.forEach(cat=>{const vals=stScores.map(s=>Number(s[cat.id]||0));row[cat.sw]=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2):"—";});
    const avgs=CATS.map(cat=>{const vals=stScores.map(s=>Number(s[cat.id]||0));return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;}).filter(v=>v!==null);
    row["Overall Average"]=avgs.length?(avgs.reduce((a,b)=>a+b,0)/avgs.length).toFixed(2):"—";
    return row;
  });
  if(!rows.length){alert("No data.");return;}
  const keys=Object.keys(rows[0]);
  const esc2=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv=keys.join(",")+"\n"+rows.map(r=>keys.map(k=>esc2(r[k])).join(",")).join("\n");
  dlCSV(csv,"KTC_Class_Summary_"+today());
}

function dlCSV(csv,name){
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download=name+".csv";a.click();
}

/* ── CHANGE PASSWORD ── */
function openCPw(){
  openMod("Change password",`
    <div class="fg">
      <div class="field full"><label>Current password</label><input type="password" id="cpCur"></div>
      <div class="field full"><label>New password *</label><input type="password" id="cpNew"></div>
      <div class="field full"><label>Confirm new *</label><input type="password" id="cpConf"></div>
    </div>
    <div class="fa"><button class="btn bp" onclick="submitCPw()">Change</button><button class="btn bg" onclick="closeMod()">Cancel</button></div>
    <div class="msg" id="cpMsg"></div>
  `);
}
async function submitCPw(){
  const msg=document.getElementById("cpMsg");
  if(v("cpCur")!==USER.password){showMsg(msg,"err","Current password incorrect.");return;}
  if(!v("cpNew")){showMsg(msg,"err","New password required.");return;}
  if(v("cpNew")!==v("cpConf")){showMsg(msg,"err","Passwords do not match.");return;}
  const res=await POST({action:"change_password",new_password:v("cpNew")});
  if(res.ok){USER.password=v("cpNew");saveSession(USER);showMsg(msg,"ok","Password changed.");setTimeout(closeMod,1500);}
  else showMsg(msg,"err",res.error||"Failed.");
}

/* ── UTILS ── */
function v(id){const el=document.getElementById(id);return el?el.value.trim():"";}
function today(){return new Date().toISOString().slice(0,10);}
function initials(str){return (str||"").split(" ").filter(Boolean).map(w=>w[0]||"").join("").slice(0,2).toUpperCase()||"—";}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):"";}
function esc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");}
function showMsg(el,type,msg){if(!el)return;el.className="msg "+(type==="ok"?"mok":type==="warn"?"mwarn":"merr")+" show";el.innerHTML=msg;}
function openMod(title,body){
  document.getElementById("mTitle").textContent=title;
  document.getElementById("mBody").innerHTML=body;
  document.getElementById("mBox").classList.remove("wide");
  document.getElementById("mBg").classList.add("open");
  document.getElementById("mBg").scrollTop=0;
}
function closeMod(){document.getElementById("mBg").classList.remove("open");}
function swTab(tabEl,panelId){
  const ctx=tabEl.closest(".modal")||document.getElementById("pc");
  ctx.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  ctx.querySelectorAll(".tpanel").forEach(p=>p.classList.remove("active"));
  tabEl.classList.add("active");
  const p=document.getElementById(panelId);if(p)p.classList.add("active");
}
</script>
